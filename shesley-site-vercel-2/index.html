<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz Aniversário, Shesley 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Dancing+Script:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3f0;--fg:#4a1f2c;--soft:#8a5a66;--card:#ffffff;--a:#e0446a;--b:#f2b36b;--line:#f3d3d3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d0b13;--fg:#ffe9ee;--soft:#d9a9b6;--card:#2c1220;--a:#ff6b8e;--b:#f6c37a;--line:#4a2336;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d0b13;--fg:#ffe9ee;--soft:#d9a9b6;--card:#2c1220;--a:#ff6b8e;--b:#f6c37a;--line:#4a2336;color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 Inter,system-ui,sans-serif;overflow-x:hidden}
h1,h2{font-family:"Playfair Display",Georgia,serif;margin:0}
.script{font-family:"Dancing Script","Brush Script MT",cursive;color:var(--a)}
section{max-width:720px;margin:0 auto;padding:64px 22px;text-align:center}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.hearts i{position:absolute;bottom:-30px;font-style:normal;animation:up linear infinite;opacity:.5}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
.hearts img{position:absolute;bottom:-160px;aspect-ratio:3/4;object-fit:cover;border:4px solid #fff;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.3);animation:up linear infinite;opacity:.9}
main{position:relative;z-index:1}
#cover{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 30%,var(--card),var(--bg));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;transition:opacity .8s,transform .8s}
#cover.gone{opacity:0;transform:scale(1.08);pointer-events:none}
#cover .env{font-size:84px;animation:beat 1.4s infinite}
@keyframes beat{50%{transform:scale(1.12)}}
.btn{font:500 17px Inter,sans-serif;border:0;border-radius:999px;padding:14px 30px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--a),#ff8fa8);box-shadow:0 8px 24px rgba(224,68,106,.35);transition:transform .2s}
.btn:active{transform:scale(.96)}.btn.alt{background:var(--card);color:var(--fg);border:1.5px solid var(--line);box-shadow:none}
.age{font-size:clamp(88px,26vw,170px);line-height:1;background:linear-gradient(135deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;font-family:"Playfair Display",serif;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 24px;box-shadow:0 10px 40px rgba(224,68,106,.12)}
.card p{margin:0 0 14px;color:var(--fg)}.card p:last-child{margin:0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:26px}
.pol{background:#fff;padding:8px 8px 26px;border-radius:6px;box-shadow:0 8px 22px rgba(0,0,0,.18);transform:rotate(var(--r));cursor:zoom-in;transition:transform .3s}
.pol:hover{transform:rotate(0) scale(1.03)}
.pol img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;border-radius:3px}
.empty{padding:26px;border:2px dashed var(--line);border-radius:18px;color:var(--soft)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
#lb img{max-width:100%;max-height:90vh;border-radius:10px}
.q{min-height:150px;display:flex;gap:18px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:26px;position:relative}
#no{transition:transform .35s cubic-bezier(.34,1.8,.5,1)}
.msg{font-size:19px;margin-top:22px}
#own{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--card);border:1.5px solid var(--a);border-radius:18px;padding:14px;font-size:14px;max-height:55vh;overflow:auto;text-align:left}
#own button{margin:4px 6px 4px 0;font:500 14px Inter,sans-serif;padding:9px 14px}
.conf{position:fixed;top:-12px;width:9px;height:14px;z-index:90;pointer-events:none;animation:fall 2.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
#mus{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:60;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-size:20px;cursor:pointer;display:none}
</style>
</head>
<body>
<script type="application/json" id="state">{"photos":["fotos/1.jpg","fotos/2.jpg","fotos/3.jpg","fotos/4.jpg","fotos/5.jpg"],"music":"musica.mp3"}</script>
<div id="app"></div>
<script>
(function(){
var S=JSON.parse(document.getElementById('state').textContent);
var app=document.getElementById('app'),H='❤💖💗💕🌸✨'.match(/./gu);
var cap=['Linda 💞','Princesa','O teu sorriso','Natural e perfeita','Pura felicidade','Meu amor 💖'];
function hearts(){var o='';for(var i=0;i<16;i++)o+='<i style="left:'+(Math.random()*100)+'%;font-size:'+(14+Math.random()*20)+'px;animation-duration:'+(9+Math.random()*10)+'s;animation-delay:-'+(Math.random()*14)+'s">'+H[i%H.length]+'</i>';for(var k=0;k<S.photos.length*2;k++){o+='<img src="'+S.photos[k%S.photos.length]+'" alt="" onerror="this.remove()" style="left:'+(3+Math.random()*80)+'%;width:'+(64+Math.random()*40)+'px;animation-duration:'+(16+Math.random()*12)+'s;animation-delay:-'+(Math.random()*20)+'s">'}return '<div class="hearts" id="fl">'+o+'</div>'}
function gal(){if(!S.photos.length)return '<div class="empty">📸 As fotos vão aparecer aqui…</div>';
return '<div class="grid">'+S.photos.map(function(u,i){return '<div class="pol" style="--r:'+(i%2?2.5:-2.5)+'deg" data-src="'+u+'"><img src="'+u+'" alt="Shesley" loading="lazy" onerror="this.parentNode.remove()"><div class="script" style="font-size:18px;margin-top:6px">'+cap[i%cap.length]+'</div></div>'}).join('')+'</div>'}
app.innerHTML=hearts()+
'<div id="cover"><div class="env">💌</div><h1 style="font-size:30px">Shesley, isto é para ti</h1><div class="script" style="font-size:24px">toca para abrir</div><button class="btn" id="open">Abrir 💖</button></div>'+
'<button id="mus" aria-label="Música">🎵</button>'+
'<main><section style="padding-top:90px"><div class="script" style="font-size:30px">Hoje é o teu dia</div><h1 style="font-size:clamp(34px,9vw,56px);margin:6px 0">Feliz Aniversário,<br>Shesley!</h1><div class="age">19</div><div class="script" style="font-size:28px">anos de luz, doçura e beleza ✨</div></section>'+
'<section><h2 style="font-size:30px;margin-bottom:20px">Uma carta para ti 💌</h2><div class="card"><p>Minha querida Shesley,</p><p>Hoje o mundo celebra o dia em que nasceu alguém muito especial. Tu tornas os meus dias mais leves, o meu coração mais calmo e o meu sorriso mais fácil.</p><p>Aos 19 anos, desejo-te saúde, paz, sonhos a tornarem-se realidade e muitos motivos para sorrires — porque o teu sorriso é a coisa mais bonita que conheço.</p><p>Obrigado por existires e por fazeres parte da minha vida. Eu amo-te muito. 💖</p><p class="script" style="font-size:26px">— Teu amor 💖</p></div></section>'+
'<section><h2 style="font-size:30px">Linda como sempre 📸</h2>'+'<div id="gal">'+gal()+'</div></section>'+
'<section><div class="card"><div class="script" style="font-size:28px">Tenho uma pergunta para ti…</div><h2 style="font-size:clamp(26px,7vw,38px);margin-top:8px">Shesley,<br>vamos a um date ao Vanilla? 🍦💖</h2><div class="q" id="q"><button class="btn" id="yes">Sim 💖</button><button class="btn alt" id="no">Não</button></div><div id="res" class="msg"></div></div></section>'+
'<section style="padding-top:10px"><div class="script" style="font-size:26px">Com todo o meu amor, para sempre teu 💞</div><p style="color:var(--soft);font-size:14px">2 de novembro de 2026</p></section></main>'+
'<div id="lb"><img alt=""></div>';

var $=function(s){return document.querySelector(s)};
var audio=null;
function setMusic(){if(!S.music)return;audio=new Audio(S.music);audio.loop=true;$('#mus').style.display='block';$('#mus').onclick=function(){if(audio.paused){audio.play();this.textContent='🎵'}else{audio.pause();this.textContent='🔇'}}}
setMusic();
function confetti(){var c=['#e0446a','#f2b36b','#ff8fa8','#fff','#c9a0ff'];for(var i=0;i<90;i++){var e=document.createElement('i');e.className='conf';e.style.cssText='left:'+Math.random()*100+'%;background:'+c[i%5]+';animation-delay:'+Math.random()*.9+'s;border-radius:'+(i%2?'50%':'2px');app.appendChild(e);setTimeout(function(x){x.remove()},4200,e)}}
$('#open').onclick=function(){$('#cover').classList.add('gone');confetti();if(audio){audio.play().catch(function(){})}};
function bind(){document.querySelectorAll('.pol').forEach(function(p){p.onclick=function(){$('#lb img').src=p.dataset.src;$('#lb').style.display='flex'}})}
$('#lb').onclick=function(){this.style.display='none'};bind();

var moves=0,no=$('#no');
var nl=['Não','Tens a certeza? 🥺','Pensa melhor 😏','Quase! 😂','Não consegues 😜','Clica no Sim 💖'];
function dodge(e){e.preventDefault();moves++;no.style.transform='translate('+((Math.random()-.5)*200)+'px,'+((Math.random()-.5)*130)+'px) rotate('+((Math.random()-.5)*40)+'deg) scale(.9)';no.textContent=nl[moves%nl.length];$('#yes').style.transform='scale('+Math.min(1+moves*.05,1.5)+')'}
no.addEventListener('pointerenter',dodge);no.addEventListener('touchstart',dodge,{passive:false});
function answer(v){
  var rec={answer:v,at:new Date().toISOString()};
  try{localStorage.setItem('shesley-answer',JSON.stringify(rec))}catch(e){}
  $('#q').style.display='none';
  var mail='mailto:venanciocristovao80@gmail.com?subject='+encodeURIComponent('A resposta da Shesley')+'&body='+encodeURIComponent('A minha resposta foi: '+v+(v==='Sim'?' 💖':''));
  if(v==='Sim'){confetti();setTimeout(confetti,900);$('#res').innerHTML='<div class="script" style="font-size:34px">Ela disse SIM! 🥰</div><p>Fiquei o homem mais feliz do mundo, Shesley. Prometo cuidar de ti e fazer-te sorrir todos os dias. Eu amo-te! 💖</p>'}
  else{$('#res').innerHTML='<div class="script" style="font-size:30px">Obrigado pela honestidade 🤍</div><p>Respeito a tua resposta. Seja como for, o teu aniversário merece ser feliz — e eu desejo-te tudo de bom.</p>'}
  $('#res').innerHTML+='<a class="btn" style="display:inline-block;text-decoration:none;margin-top:10px" href="'+mail+'">Enviar a minha resposta ao meu amor 💌</a>';
}
$('#yes').onclick=function(){answer('Sim')};
no.onclick=function(e){dodge(e)};


})();
</script>
</body>
</html>
